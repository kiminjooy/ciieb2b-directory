<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korea Pavilion Company Directory</title>
  <style>
    :root {
      --navy: #10233f;
      --blue: #2764ff;
      --sky: #eef4ff;
      --line: #e6eaf0;
      --text: #18202b;
      --muted: #6f7a89;
      --white: #ffffff;
      --green: #17865c;
      --shadow: 0 18px 50px rgba(25, 49, 88, 0.10);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: #f7f9fc;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", "PingFang SC",
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 72px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(16,35,63,.08);
    }

    .topbar-inner {
      width: min(1200px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      color: var(--navy);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 13px;
      letter-spacing: .08em;
      background: linear-gradient(145deg, #1948d8, #3b82f6);
      box-shadow: 0 8px 22px rgba(39,100,255,.28);
    }

    .nav {
      display: flex;
      gap: 24px;
      color: #465264;
      font-size: 14px;
      font-weight: 650;
    }

    .nav a:hover { color: var(--blue); }

    .hero {
      color: white;
      background:
        radial-gradient(circle at 82% 18%, rgba(91,151,255,.52), transparent 30%),
        radial-gradient(circle at 12% 85%, rgba(39,100,255,.42), transparent 27%),
        linear-gradient(135deg, #0d1f3b 0%, #173764 48%, #2355a4 100%);
      overflow: hidden;
    }

    .hero-inner {
      width: min(1200px, calc(100% - 40px));
      min-height: 470px;
      margin: 0 auto;
      padding: 78px 0 72px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.09);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8ec5ff;
      box-shadow: 0 0 0 6px rgba(142,197,255,.12);
    }

    .hero h1 {
      margin: 24px 0 18px;
      max-width: 770px;
      font-size: clamp(42px, 6vw, 76px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .hero h1 span {
      display: block;
      margin-top: 13px;
      color: #b8d4ff;
      font-size: .47em;
      letter-spacing: -.01em;
      line-height: 1.15;
    }

    .hero-copy {
      max-width: 660px;
      margin: 0;
      color: rgba(255,255,255,.76);
      font-size: 16px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .hero-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,.25);
    }

    .hero-btn.primary {
      background: white;
      color: var(--navy);
      border-color: white;
    }

    .hero-btn.secondary { background: rgba(255,255,255,.08); }

    .hero-panel {
      position: relative;
      min-height: 300px;
      display: grid;
      place-items: center;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(.2px);
    }

    .orb.one {
      width: 270px;
      height: 270px;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 80px rgba(255,255,255,.08);
    }

    .orb.two {
      width: 155px;
      height: 155px;
      transform: translate(102px, -77px);
      background: rgba(88,159,255,.22);
      border: 1px solid rgba(255,255,255,.18);
    }

    .hero-stat-card {
      position: relative;
      z-index: 2;
      width: 260px;
      padding: 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(9,28,57,.38);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,.18);
    }

    .hero-stat-card strong {
      display: block;
      font-size: 78px;
      line-height: 1;
      letter-spacing: -.06em;
    }

    .hero-stat-card span {
      display: block;
      margin-top: 10px;
      color: rgba(255,255,255,.72);
      font-size: 14px;
    }

    .stats-wrap {
      width: min(1200px, calc(100% - 40px));
      margin: -34px auto 0;
      position: relative;
      z-index: 5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      background: white;
      border: 1px solid rgba(16,35,63,.07);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stat {
      padding: 24px 26px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child { border-right: 0; }

    .stat b {
      display: block;
      color: var(--navy);
      font-size: 25px;
      letter-spacing: -.03em;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 84px 0 20px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-kicker {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .section h2 {
      margin: 8px 0 0;
      color: var(--navy);
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -.035em;
    }

    .section-desc {
      max-width: 450px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .search-panel {
      padding: 22px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(34,56,96,.07);
    }

    .search-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    .field {
      height: 50px;
      width: 100%;
      padding: 0 15px;
      border: 1px solid #dfe5ed;
      border-radius: 13px;
      outline: none;
      color: var(--text);
      background: #fbfcfe;
    }

    .field:focus {
      border-color: rgba(39,100,255,.7);
      box-shadow: 0 0 0 4px rgba(39,100,255,.08);
    }

    .results-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 2px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .results-line strong { color: var(--navy); }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .company-card {
      position: relative;
      min-width: 0;
      background: white;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      transition: .25s ease;
      display: flex;
      flex-direction: column;
      min-height: 430px;
    }

    .company-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 46px rgba(35,63,110,.12);
      border-color: rgba(39,100,255,.22);
    }

    .visual {
      position: relative;
      height: 170px;
      padding: 22px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: linear-gradient(140deg, #edf4ff, #dce9ff);
    }

    .visual.food { background: linear-gradient(140deg, #e9fbf4, #ccefe1); }
    .visual.beauty { background: linear-gradient(140deg, #fff0f5, #fbd7e5); }
    .visual.health { background: linear-gradient(140deg, #f3efff, #ded4ff); }
    .visual.lifestyle { background: linear-gradient(140deg, #fff5dc, #ffe6a9); }
    .visual.industry { background: linear-gradient(140deg, #edf1f5, #d7dee7); }

    .visual::before,
    .visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
    }

    .visual::before {
      width: 150px;
      height: 150px;
      right: -42px;
      top: -45px;
    }

    .visual::after {
      width: 82px;
      height: 82px;
      right: 60px;
      top: 50px;
      background: rgba(255,255,255,.32);
    }

    .initials{
    position:relative;
    z-index:1;
    font-size:32px;
    font-weight:900;
    line-height:1.15;
    color:rgba(16,35,63,.78);
    white-space:pre-line;
    word-break:break-word;
    max-width:85%;
    }

    .booth {
      position: absolute;
      z-index: 3;
      top: 16px;
      left: 16px;
      padding: 7px 10px;
      color: var(--navy);
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 999px;
    }

    .card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .category {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .company-name {
      margin: 8px 0 12px;
      color: var(--navy);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      white-space: pre-line;
    }

    .products {
      margin: 17px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      min-height: 44px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: auto;
      margin-top: auto;
      padding-top: 18px;
    }

    .btn {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
    }

    .btn.primary {
      color: white;
      background: var(--navy);
    }

    .btn.ghost {
      min-width: 42px;
      color: var(--navy);
      background: #f1f5fa;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      background: white;
      border: 1px dashed #ccd5e2;
      border-radius: 22px;
    }

    .footer {
      margin-top: 100px;
      padding: 44px 20px;
      color: rgba(255,255,255,.66);
      background: var(--navy);
      text-align: center;
      font-size: 13px;
    }

    .footer b {
      display: block;
      margin-bottom: 7px;
      color: white;
      font-size: 16px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8,18,34,.64);
      backdrop-filter: blur(8px);
    }

    .modal.open { display: flex; }

    .modal-box {
      width: min(980px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 26px;
      box-shadow: 0 30px 100px rgba(0,0,0,.3);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .modal-head b { color: var(--navy); }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: var(--navy);
      background: #f0f3f7;
      font-size: 20px;
    }

    .detail-hero {
      padding: 38px;
      color: white;
      background:
        radial-gradient(circle at 90% 20%, rgba(110,165,255,.65), transparent 27%),
        linear-gradient(135deg, #12284a, #285aa7);
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 15px;
    }

    .detail-chip {
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
    }

    .detail-hero h3 {
      margin: 0;
      font-size: clamp(29px, 5vw, 48px);
      letter-spacing: -.04em;
    }

    .detail-hero p {
      max-width: 680px;
      margin: 14px 0 0;
      color: rgba(255,255,255,.75);
      line-height: 1.7;
    }

    .detail-content { padding: 34px 38px 42px; }

    .detail-section + .detail-section {
      margin-top: 38px;
      padding-top: 34px;
      border-top: 1px solid var(--line);
    }

    .detail-section h4 {
      margin: 0 0 18px;
      color: var(--navy);
      font-size: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info-item {
      min-height: 102px;
      padding: 18px;
      background: #f7f9fc;
      border: 1px solid #edf0f4;
      border-radius: 15px;
    }

    .info-item small {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .info-item div {
      color: #2a3442;
      line-height: 1.6;
      font-size: 14px;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 17px;
    }

    .product-card h5 {
      margin: 0 0 9px;
      color: var(--navy);
      font-size: 17px;
    }

    .product-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .certs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .cert {
      padding: 6px 9px;
      color: #35517d;
      background: #eef4ff;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .detail-actions a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .detail-actions .web {
      color: white;
      background: var(--blue);
    }

    .detail-actions .catalog {
      color: var(--navy);
      background: #eef2f7;
    }

      @media (max-width: 900px) {
      .nav { display: none; }
      .hero-inner { grid-template-columns: 1fr; min-height: auto; }
      .hero-panel { display: none; }
      .stats {grid-template-columns: repeat(2, 1fr);}
      .stat {border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);}
      .stat:nth-child(2n) {border-right: 0;}
      .company-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .topbar-inner, .hero-inner, .stats-wrap, .section {
        width: min(100% - 24px, 1200px);
      }
      .hero-inner { padding: 58px 0 65px; }
      .hero h1 { font-size: 44px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 19px 16px; }
      .section { padding-top: 62px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .company-grid { grid-template-columns: 1fr; }
      .info-grid, .product-list { grid-template-columns: 1fr; }
      .detail-hero, .detail-content { padding-left: 22px; padding-right: 22px; }
      .search-row {grid-template-columns: 1fr;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">
        <span class="brand-mark">KR</span>
        <span>韩国馆采购对接活动</span>
      </a>
      <nav class="nav">
        <a href="#companies">企业目录</a>
          <a href="https://kiminjooy.github.io/ciieb2b/#consult" target="_blank" rel="noopener noreferrer">联系我们</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div>
        <h1>
          韩国馆采购对接活动
          <span>韩国参展企业清单</span>
        </h1>
        <p class="hero-copy">
          
        </p>
        
      </div>
      <div class="hero-panel">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="hero-stat-card">
          <strong id="heroCompanyCount">87</strong>
          <span>参展企业</span>
        </div>
      </div>
    </div>
  </section>

  <div class="stats-wrap">
    <div class="stats" id="statsContainer"></div>
  </div>

  <main id="companies" class="section">
    <div class="section-head">
      <div>
        <div class="section-kicker">Company Directory</div>
        <h2>韩国企业目录</h2>
      </div>
      <p class="section-desc">
        설명설명
      </p>
    </div>

    <div class="search-panel">
      <div class="search-row">
        <input
          id="searchInput"
          class="field"
          type="search"
          placeholder="请输入企业名称或产品名称"/>

        <select id="industryFilter" class="field">
          <option value="">全部</option>
        </select>
        <select id="hallFilter" class="field">
          <option value="">全部展馆</option>
          <option value="农食产品展区">农食产品展区</option>
          <option value="消费品展区">消费品展区</option>
        </select>

      </div>
    </div>

    <div class="results-line">
      <span>搜索结果：<strong id="resultCount">0</strong> 家企业</span>
      <span>点击企业查看详情</span>
    </div>

    <div id="companyGrid" class="company-grid"></div>
  </main>

  <footer id="contact" class="footer">
    <b>Korea International Trade Association (KITA)</b>
    <span>韩国贸易协会 · 国际采购商对接服务中心</span>
  </footer>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <b>企业详情</b>
        <button class="close" type="button" onclick="closeModal()" aria-label="Close">×</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>

    let companies = [];
    fetch("companies.json")
      .then(res => res.json())
      .then(data => {companies = data;initialize();});

    const grid = document.getElementById("companyGrid");
    const searchInput = document.getElementById("searchInput");
    const industryFilter = document.getElementById("industryFilter");
    const hallFilter = document.getElementById("hallFilter");
    const resultCount = document.getElementById("resultCount");
    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");

    function getInitials(name) {
      return name.split(/\s+/).slice(0, 2).map(word => word[0]).join("").toUpperCase();
    }

    function renderCompanies() {
      const keyword = searchInput.value.trim().toLowerCase();
      const category = industryFilter.value;
      const hall = hallFilter.value;

      const filtered = companies.filter(company => {
        const productText = company.products
          .map(product => `${product.name} ${product.description}`)
          .join(" ");

        const searchable = `
         ${company.name}
         ${company.category || ""}
         ${company.industry || ""}
         ${company.hall || ""}
         ${productText}
       `.toLowerCase();

        const matchesKeyword = !keyword || searchable.includes(keyword);
        const matchesIndustry = !category || company.category === category;
        const matchesHall = !hall || company.hall === hall;
        return matchesKeyword && matchesIndustry && matchesHall;
      });
      resultCount.textContent = filtered.length;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty">没有找到符合条件的企业。请调整搜索条件。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(company => `
        <article class="company-card">
          <div class="visual ${getVisualClass(company.category)}">
            ${company.booth? `<span class="booth">${company.booth}</span>`: ""}
            <span class="initials company-title"> ${company.name} </span>
          </div>
          <div class="card-body">
            <div class="category">${company.category || ""}</div>
            <h3 class="company-name">${company.products.map(product => `• ${product.name}`).join("<br>")}</h3>
            <div class="card-actions">
              <button class="btn primary" type="button" onclick='openModal(${JSON.stringify(company.id)})'>查看企业详情</button>
            </div>
          </div>
        </article>
      `).join("");

      function getVisualClass(category) {
        switch ((category || "").trim()) {
          case "美妆个护":
            return "beauty";

          case "休闲食品":
          case "保健食品":
          case "水产品":
            return "food";

          case "医疗保健":
            return "health";

          case "生活用品":
          case "母婴用品":
          case "宠物用品":
            return "lifestyle";

          default:
            return "industry";
        }
      }
    }

    function openModal(id) {
      const company = companies.find(item => item.id === id);
      if (!company) return;

      modalContent.innerHTML = `
        <section class="detail-hero">
          <div class="detail-meta">
            <span class="detail-chip">${company.booth}</span>
            <span class="detail-chip">${company.category}</span>
          </div>
          <h3>${company.name}</h3>
          <p>${company.description || ""}</p>
        </section>

        <div class="detail-content">
          <section class="detail-section">
            <h4>企业信息</h4>
            <div class="info-grid">
              <div class="info-item">
                <small>企业属性</small>
                <div>${company.industry}</div>
              </div>
              <div class="info-item">
                <small>OEM / ODM</small>
                <div>${company.oemOdm || "暂无信息"}</div>
              </div>
              <div class="info-item">
                <small>中国销售渠道</small>
                <div>${company.chinaChannels || "暂无信息"}</div>
              </div>
              <div class="info-item">
                <small>中国合作情况</small>
                <div>${company.chinaPartner || "暂无信息"}</div>
              </div>
            </div>
            <div class="detail-actions">
              ${company.websites && company.websites.length ? company.websites .map((website, index) => `<a class="web" href="${website}" target="_blank" rel="noopener noreferrer">
              ${company.websites.length > 1 ? `访问企业官网 ${index + 1} ↗` : "访问企业官网 ↗"} </a>`) .join("") : ""}
              ${company.catalog ? `<a class="catalog" href="${company.catalog}" target="_blank">下载产品目录 ↗</a>` : ""}
            </div>
          </section>

          <section class="detail-section">
            <h4>产品信息</h4>
            <div class="product-list">
              ${company.products.map(product => `
                <article class="product-card">
                  <h5>${product.name}</h5>
                  <p>${product.description || "暂无产品说明"}</p>
                  ${product.certs && product.certs.length ? `
                    <div class="certs">
                      ${product.certs.map(cert => `<span class="cert">${cert}</span>`).join("")}
                    </div>
                  ` : ""}
                </article>
              `).join("")}
            </div>
          </section>
        </div>
      `;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    searchInput.addEventListener("input", renderCompanies);
    industryFilter.addEventListener("change", renderCompanies);
    hallFilter.addEventListener("change", renderCompanies);

    function renderStats() {
      const statsContainer = document.getElementById("statsContainer");

      const categoryCounts = companies.reduce((counts, company) => {
        const category = company.category || "其他";

        counts[category] = (counts[category] || 0) + 1;

        return counts;
      }, {});

      const categoryStats = Object.entries(categoryCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([category, count]) => `
          <div class="stat">
            <b>${count}</b>
            <span>${category}</span>
          </div>
        `)
        .join("");

      statsContainer.innerHTML = `
        <div class="stat">
          <b>${companies.length}</b>
          <span>参展企业</span>
        </div>

        ${categoryStats}
      `;
      document.getElementById("heroCompanyCount").textContent = companies.length;
    }
    function initialize() {
      const categories = [...new Set(
        companies
          .map(company => company.category)
          .filter(Boolean)
      )];

      industryFilter.innerHTML = `
        <option value="">全部</option>
        ${categories
          .map(category => `
            <option value="${category}">${category}</option>
          `)
          .join("")}
      `;

      renderStats();
      renderCompanies();
    }

  </script>
</body>
</html>
